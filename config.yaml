trading:
  starting_cash: 100000.0
  symbols:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - SPY
  tick_interval_seconds: 60

strategies:
  sma_crossover:
    enabled: true
    fast_period: 10
    slow_period: 30
    symbols:
      - AAPL
      - MSFT
      - SPY

broker:
  slippage_pct: 0.001
  commission_per_trade: 0.0

database:
  path: data/trader.db

dashboard:
  host: "0.0.0.0"
  port: 8000

analysis:
  trades_before_review: 20
  model: "claude-sonnet-4-6"
